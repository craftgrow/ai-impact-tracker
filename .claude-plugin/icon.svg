        fill="url(#leaf)"/>
  <!-- vein -->
  <path d="M666 292C520 330 390 430 300 612"
        stroke="#27402F" stroke-opacity="0.55" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- three ascending bars: this measures something -->
  <rect x="300" y="742" width="86" height="92"  rx="30" fill="#A8C8A6" opacity="0.92"/>
  <rect x="434" y="700" width="86" height="134" rx="30" fill="#A8C8A6" opacity="0.92"/>
  <rect x="568" y="640" width="86" height="194" rx="30" fill="#C9A15A"/>
